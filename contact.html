<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erdi Qosi | Kontakt</title>

    <!-- Allgemeines Design -->
    <link rel="stylesheet" href="style.css">

    <!-- Spezielles Design für Kontakt -->
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div class="portfolio-container">

<!--LINKE SEITE-->
        <aside class="sidebar">

        <div class="profile-image">
            <img src="XXXXXX">
        </div>
        <h1>Erdi Qosi</h1>

    <p class="profession">
        Sachbearbeiter
    </p>

    <div class="profile-info">
        <p>Thun, Schweiz</p>
        <p>Deutsch / Englisch / Französisch</p>
        <p>
            <a href="https://github.com/erdiq" target="_blank">GitHub</a>
        </p>
        <p>
            <a href="mailto:erdiqosi@gmail.com">E-Mail</a>
        </p>
    </div>
</aside>

        <!-- RECHTE SEITE -->
        <main class="main-content">

            <!-- NAVIGATION -->
            <nav class="navbar">

                <a href="index.html">Über mich</a>
                <a href="resume.html">Werdegang</a>
                <a href="skills.html">Kenntnisse</a>
                <a href="contact.html">Kontakt</a>

            </nav>


            <!-- KONTAKT -->
            <section class="contact">

                <h2>Kontakt</h2>

                <div class="title-line"></div>

                <p class="contact-intro">
                    Du möchtest mit mir Kontakt aufnehmen?
                    Schreib mir gerne eine Nachricht.
                </p>


                <!-- KONTAKTFORMULAR -->
                <form class="contact-form" id="contact-form">

                    <!-- NAME -->
                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Dein Name"
                            required
                        >

                    </div>


                    <!-- E-MAIL -->
                    <div class="form-group">

                        <label for="email">
                            E-Mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Deine E-Mail-Adresse"
                            required
                        >

                    </div>


                    <!-- BETREFF -->
                    <div class="form-group">

                        <label for="subject">
                            Betreff
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Betreff deiner Nachricht"
                            required
                        >

                    </div>


                    <!-- NACHRICHT -->
                    <div class="form-group">

                        <label for="message">
                            Nachricht
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            placeholder="Schreib hier deine Nachricht..."
                            required
                        ></textarea>

                    </div>


                    <!-- BUTTON -->
                    <button type="submit" class="contact-button">
                        Nachricht senden
                    </button>

                </form>

            </section>

        </main>

    </div>

    <!-- JavaScript für spätere Formularvalidierung -->
    <script src="js/contact.js"></script>

</body>

</html>
